<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CV — Manuel Vilcazan Mendoza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @page {
      size: A4;
      margin: 12mm 14mm 12mm 14mm;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-size: 9pt;
      line-height: 1.35;
      color: #111827;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                   "Noto Sans", "Noto Sans CJK SC", "Microsoft YaHei", "Noto Sans CJK JP", "Yu Gothic",
                   "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
    }
    .cv-container {
      max-width: 190mm;
      margin: 0 auto;
    }
    /* Header */
    header {
      border-bottom: 2px solid #0f172a;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 {
      margin: 0;
      font-size: 17pt;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .cv-title {
      font-size: 10.5pt;
      font-weight: 600;
      color: #0d9488;
      margin: 2px 0 3px;
    }
    .contact-line {
      font-size: 8pt;
      color: #4b5563;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 3px;
    }
    .contact-line span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .contact-line a {
      color: #0369a1;
      text-decoration: none;
    }
    .contact-line a:hover {
      text-decoration: underline;
    }
    /* Sections */
    section {
      margin-bottom: 7px;
    }
    h2 {
      font-size: 9.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0f172a;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 2px;
      margin: 0 0 4px;
    }
    p {
      margin: 0 0 4px;
    }
    /* Summary */
    .summary-text {
      font-size: 8.5pt;
      color: #334155;
      text-align: justify;
    }
    /* Experience / Education / Projects items */
    .item {
      margin-bottom: 5px;
      page-break-inside: avoid;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-weight: 600;
      font-size: 9pt;
      color: #0f172a;
    }
    .item-sub {
      display: flex;
      justify-content: space-between;
      font-size: 8pt;
      color: #0d9488;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .item-period {
      font-size: 8pt;
      font-weight: 400;
      color: #64748b;
    }
    ul.bullets {
      margin: 2px 0 4px 14px;
      padding: 0;
      list-style-type: disc;
    }
    ul.bullets li {
      font-size: 8pt;
      color: #334155;
      margin-bottom: 1.5px;
      line-height: 1.3;
    }
    /* Grid 2-col for competencies / courses / skills */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .ctf-list, .cisco-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .ctf-list li, .cisco-list li {
      font-size: 8pt;
      color: #334155;
      margin-bottom: 2px;
      line-height: 1.25;
    }
    .ctf-list strong, .cisco-list strong {
      color: #0f172a;
    }
    .tag-badge {
      font-size: 7.5pt;
      font-weight: 600;
      color: #047857;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 3px;
      padding: 0 4px;
      display: inline-block;
      margin-left: 3px;
    }
    .tech-pill {
      font-size: 7.5pt;
      color: #334155;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 3px;
      padding: 0 4px;
      margin-right: 2px;
      display: inline-block;
    }
    /* Skills block */
    .skills-block {
      font-size: 8pt;
      color: #334155;
      line-height: 1.35;
    }
    .skills-block strong {
      color: #0f172a;
    }
    /* Note box */
    .note-box {
      font-size: 7.5pt;
      color: #64748b;
      font-style: italic;
      margin-top: 2px;
    }
    @media print {
      body {
        background: transparent;
      }
      .page-break {
        page-break-before: always;
      }
    }
  </style>
</head>
<body>
  <div class="cv-container" id="cv-root">
    <!-- Populated by script via JSON data -->
  </div>
</body>
</html>
